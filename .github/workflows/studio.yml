name: Deploy Prisma Studio to Azure Container Apps

on:
  push:
    branches: ["azure"]
    paths:
      - 'prisma/**'            # schema.prisma、migrations 等任何異動
      - 'package*.json'        # 依賴套件更新（例如升級 prisma 版本）
      - 'Dockerfile.studio'    # Studio 專屬的容器設定檔異動
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 編譯並更新 Prisma Studio
      - name: Build and deploy Prisma Studio
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: ./Dockerfile.studio
          acrName: hdwghregistry
          containerAppName: hdwgh-studio
          resourceGroup: HDWGH_API
